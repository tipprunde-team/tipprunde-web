<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spieltag – Tipprunde</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-nav="groups" data-group-tab="matchday">

<header id="site-header"></header>

<main id="main" class="container matchday">
    <h1 class="sr-only">Spieltag</h1>

    <!-- Tabs Spieltag / Rangliste / Gruppe, filled by group-nav.js (groupId from ?groupId=) -->
    <nav id="group-tabs" class="tabs" aria-label="Bereiche der Tippgruppe"></nav>

    <!-- Spieltag wechseln -->
    <div class="matchday-nav">
        <button type="button" class="matchday-nav__btn" id="md-prev" aria-label="Vorheriger Spieltag">‹</button>
        <h2 class="matchday-nav__title" id="md-title">Spieltag</h2>
        <button type="button" class="matchday-nav__btn" id="md-next" aria-label="Nächster Spieltag">›</button>
    </div>

    <div id="page-alert" class="alert" role="status" hidden></div>

    <!-- Spiele, gruppiert nach Tag; füllt matchday.js -->
    <div id="matchday-list"></div>
</main>

<footer id="site-footer"></footer>

<!-- Do not change the order -->
<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/auth-nav.js"></script>
<script src="../../js/group-nav.js"></script>
<script src="../../js/pages/matchday.js"></script>
</body>
</html>
