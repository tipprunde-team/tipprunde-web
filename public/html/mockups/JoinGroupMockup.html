<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruppe beitreten (Mockup) – Tipprunde</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-nav="groups" data-mockup="join">

<header id="site-header"></header>

<main id="main" class="container narrow">
    <div class="mockup-bar">
        <span>Mockup: gültiger Testcode <code>K7FQ2XZ9</code>, jeder andere Code ist ungültig</span>
    </div>

    <h1>Gruppe beitreten</h1>
    <p class="page-lead">Gib den Einladungscode ein, den du vom Admin der Gruppe bekommen hast.</p>

    <div id="page-alert" class="alert" role="alert" hidden></div>

    <div class="card">
        <form id="join-form" novalidate>
            <div class="form-group">
                <label class="label" for="invite-code">Einladungscode</label>
                <input class="input" type="text" id="invite-code" name="inviteCode" autocomplete="off" spellcheck="false" required>
            </div>
            <button type="submit" class="btn btn-secondary btn-block">Code prüfen</button>
        </form>
    </div>

    <!-- Vorschau der Gruppe und Beitreten; füllt mockups.js -->
    <div class="card" id="join-preview" aria-live="polite" hidden></div>
</main>

<footer id="site-footer"></footer>

<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/pages/mockups.js"></script>
</body>
</html>
