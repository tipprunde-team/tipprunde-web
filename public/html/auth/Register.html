<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren – Tipprunde</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-nav="">

<header id="site-header"></header>

<main id="main" class="container">
    <h1>Registrieren</h1>

    <!-- Fehlermeldungen (showError aus api.js) -->
    <div id="page-alert" class="alert" hidden></div>

    <div class="card">
        <form id="register-form" novalidate>
            <div class="form-group">
                <label class="label" for="email">E-Mail</label>
                <input class="input" type="email" id="email" name="email" autocomplete="email" required>
                <div id="email-error" style="display:none;"></div>
            </div>

            <div class="form-group">
                <label class="label" for="username">Benutzername</label>
                <input class="input" type="text" id="username" name="username" autocomplete="username" required>
                <small>3 bis 30 Zeichen: Buchstaben, Ziffern, _ . -</small>
                <div id="username-error" style="display:none;"></div>
            </div>

            <div class="form-group">
                <label class="label" for="password">Passwort</label>
                <input class="input" type="password" id="password" name="password" autocomplete="new-password" required>
                <small>8 bis 72 Zeichen</small>
            </div>

            <div class="form-group">
                <label class="label" for="password2">Passwort wiederholen</label>
                <input class="input" type="password" id="password2" name="password2" autocomplete="new-password" required>
            </div>

            <button type="submit" id="register-button" class="btn btn-primary btn-block">Registrieren</button>
        </form>

        <p>Schon ein Konto? <a href="Logon.html">Anmelden</a></p>
    </div>
</main>

<footer id="site-footer"></footer>

<!-- Reihenfolge nicht ändern -->
<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/layout.js"></script>
<!-- ab Tag 4 (Niklas): <script src="../../js/auth-nav.js"></script> -->
<script src="../../js/pages/register.js"></script>
</body>
</html>
