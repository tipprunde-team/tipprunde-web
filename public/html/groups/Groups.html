<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tippgruppen – Tipprunde</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-nav="groups">

<header id="site-header"></header>

<!-- Inhalt bleibt verborgen, bis requireLogin() die Sitzung bestätigt hat -->
<main id="main" class="container" style="display:none;">
    <h1>Tippgruppen</h1>

    <div class="card">
        <p>Deine Tippgruppen folgen hier.</p>
    </div>
</main>

<footer id="site-footer"></footer>

<!-- Reihenfolge nicht ändern -->
<script src="../../js/jquery-3.6.0.min.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/auth-nav.js"></script>
<script>
    // Geschützte Seite: ohne Sitzung geht es zum Login, mit Rücksprung hierher
    if (requireLogin()) {
        $('#main').show();
    }
</script>
</body>
</html>
